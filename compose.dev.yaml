services:
  frontend:
    build:
      target: development
    image: mahjongflow-frontend:dev
    environment:
      NODE_ENV: development
      LOCAL_DOCKER_POLLING: "true"
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./public
        target: /app/public
        read_only: true
        bind:
          create_host_path: false
