services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Run start-local.ps1 first}
    image: mahjongflow-frontend:local
    container_name: mahjongflow-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3000/supabase
      NEXT_PUBLIC_SUPABASE_SAME_ORIGIN: "true"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Run start-local.ps1 first}
      APP_BASE_URL: http://localhost:3000
      LOCAL_DOCKER_HOST_IP: ${LOCAL_DOCKER_HOST_IP:?Run start-local.ps1 first}
    networks:
      - supabase
networks:
  supabase:
    external: true
    name: supabase_network_MahjongFlow
