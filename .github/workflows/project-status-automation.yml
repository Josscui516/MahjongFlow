name: Project status automation

on:
  issues:
    types: [opened, edited, reopened, closed]
  create:
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review, converted_to_draft, synchronize, closed]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

concurrency:
  group: project-status-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update-project:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: Josscui516
      PROJECT_NUMBER: "5"
    steps:
      - name: Check out trusted automation from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update Project state
        run: node .github/scripts/project-automation.mjs
